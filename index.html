<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RecruitIQ · Sign In</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,Segoe UI,sans-serif;min-height:100vh;background:linear-gradient(135deg,#081326,#132642);display:grid;place-items:center;color:#10213b;overflow:auto}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);opacity:.25;pointer-events:none}
body:before{width:380px;height:380px;background:#4f46e5;left:-140px;top:-100px}
body:after{width:360px;height:360px;background:#06b6d4;right:-150px;bottom:-120px}
.login-wrap{width:min(430px,calc(100% - 30px));background:#fff;border-radius:24px;padding:34px 40px 28px;box-shadow:0 25px 70px #0006;position:relative;overflow:hidden}
.login-wrap:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#4f46e5,#7c3aed)}
.brand{text-align:center;margin-bottom:28px}
.logo{width:54px;height:54px;margin:0 auto 10px;border-radius:15px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 10px 25px #4f46e54d}
.brand h1{font-size:25px}.brand p{font-size:13px;color:#94a3b8;margin-top:5px}
.form-group{margin-bottom:17px}.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#475569}
.input{height:50px;border:1px solid #dfe6f0;border-radius:11px;display:flex;align-items:center;gap:10px;padding:0 14px;transition:.2s;background:#fff}
.input:focus-within{border-color:#6366f1;box-shadow:0 0 0 4px #6366f11a}
.input i{color:#94a3b8;font-size:18px}.input input{border:0;outline:0;width:100%;font-size:13px;color:#10213b;background:transparent}
.toggle{border:0;background:none;color:#94a3b8;cursor:pointer;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;margin:2px 0 20px}
.remember{display:flex;align-items:center;gap:8px;font-size:12px;color:#64748b;cursor:pointer}.remember input{width:17px;height:17px;accent-color:#4f46e5}
.link{border:0;background:none;color:#4f46e5;font-size:12px;font-weight:700;cursor:pointer}
.btn{width:100%;height:52px;border:0;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 9px 22px #4f46e54d;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{opacity:.7;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:12px;color:#a0aec0;font-size:11px;margin:26px 0}.divider:before,.divider:after{content:"";height:1px;background:#e8edf4;flex:1}
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.social{height:45px;border:1px solid #e1e7f0;background:#fff;border-radius:10px;color:#475569;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px}
.social:hover{background:#f8fafc}.social i{font-size:17px}
.demo{margin-top:20px;background:#f8f7ff;border:1px solid #e6e2ff;border-radius:10px;padding:11px;font-size:11px;color:#64748b;text-align:center}.demo b{color:#4f46e5}
.message{display:none;margin-bottom:15px;border-radius:9px;padding:10px 12px;font-size:11px;font-weight:700}.message.show{display:flex;gap:8px;align-items:center}.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.success{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;place-items:center;padding:15px}.modal.show{display:grid}.modal-card{background:#fff;border-radius:18px;width:min(390px,100%);padding:25px}.modal-card h3{font-size:18px;margin-bottom:5px}.modal-card p{font-size:11px;color:#64748b;margin-bottom:18px}.modal-actions{display:flex;gap:9px;margin-top:14px}.modal-actions button{flex:1}
.cancel{background:#fff;color:#475569;border:1px solid #dfe6f0;box-shadow:none}
.spinner{width:15px;height:15px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.login-wrap{padding:30px 22px}.social span{display:none}}
</style>
</head>
<body>
<main class="login-wrap">
<div class="brand">
  <div class="logo"><i class="bi bi-graph-up-arrow"></i></div>
  <h1>RecruitIQ</h1>
  <p>Sign in to your account</p>
</div>

<div id="message" class="message"></div>

<form id="loginForm" novalidate>
<div class="form-group">
<label>Email</label>
<div class="input"><i class="bi bi-envelope"></i><input id="email" type="email" autocomplete="username" placeholder="Enter your email" required></div>
</div>

<div class="form-group">
<label>Password</label>
<div class="input"><i class="bi bi-lock"></i><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="toggle" type="button" id="togglePassword" title="Show password"><i class="bi bi-eye"></i></button></div>
</div>

<div class="row">
<label class="remember"><input id="remember" type="checkbox"> Remember me</label>
<button type="button" class="link" id="forgotBtn">Forgot password?</button>
</div>

<button class="btn" id="loginBtn" type="submit"><span>Sign In</span><i class="bi bi-arrow-right"></i></button>
</form>

<div class="demo">Demo login: <b>admin@recruitiq.com</b> / <b>admin123</b></div>
</main>

<div class="modal" id="forgotModal">
<div class="modal-card">
<h3>Reset Password</h3>
<p>Enter your registered email. For this local project, the reset endpoint will return a temporary password.</p>
<div class="form-group"><label>Email</label><div class="input"><i class="bi bi-envelope"></i><input id="resetEmail" type="email" placeholder="Enter registered email"></div></div>
<div id="resetMessage" class="message"></div>
<div class="modal-actions"><button class="btn cancel" id="closeModal" type="button">Cancel</button><button class="btn" id="resetBtn" type="button">Reset Password</button></div>
</div>
</div>

<script>
const API="http://localhost:5000/api/auth";
const $=id=>document.getElementById(id);

function message(text,type="error",target=$("message")){
 target.className=`message show ${type}`;
 target.innerHTML=`<i class="bi ${type==="success"?"bi-check-circle-fill":"bi-exclamation-circle-fill"}"></i>${text}`;
}
function clearMessage(target=$("message")){target.className="message";target.innerHTML=""}

$("togglePassword").onclick=()=>{
 const input=$("password"),icon=$("togglePassword").querySelector("i");
 input.type=input.type==="password"?"text":"password";
 icon.className=input.type==="password"?"bi bi-eye":"bi bi-eye-slash";
};

$("forgotBtn").onclick=()=>{$("forgotModal").classList.add("show");clearMessage($("resetMessage"));$("resetEmail").focus()};
$("closeModal").onclick=()=>$("forgotModal").classList.remove("show");
$("forgotModal").addEventListener("click",e=>{if(e.target.id==="forgotModal")$("forgotModal").classList.remove("show")});

function saveSession(data,remember){
 const storage=remember?localStorage:sessionStorage;
 storage.setItem("recruitiq_user",JSON.stringify(data.user));
 storage.setItem("recruitiq_token",data.token);
 if(remember)localStorage.setItem("recruitiq_remember","1");
}
function validate(){
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!email.includes("@")){message("Please enter a valid email address.");$("email").focus();return false}
 if(password.length<6){message("Password must contain at least 6 characters.");$("password").focus();return false}
 return true;
}
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();clearMessage();
 if(!validate())return;
 const btn=$("loginBtn");btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Signing in...';
 try{
   const r=await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value,remember:$("remember").checked})});
   const data=await r.json();
   if(!r.ok||!data.success)throw new Error(data.message||"Invalid email or password");
   saveSession(data,$("remember").checked);
   message("Login successful. Opening dashboard...","success");
   setTimeout(()=>location.href="dashboard.html",500);
 }catch(err){message(err.message||"Unable to connect to backend.");}
 finally{btn.disabled=false;btn.innerHTML='<span>Sign In</span><i class="bi bi-arrow-right"></i>'}
});
$("resetBtn").onclick=async()=>{
 const email=$("resetEmail").value.trim();clearMessage($("resetMessage"));
 if(!email||!email.includes("@")){message("Enter a valid registered email.","error",$("resetMessage"));return}
 try{
   const r=await fetch(API+"/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
   const data=await r.json();
   if(!r.ok||!data.success)throw new Error(data.message||"Reset failed");
   message(`Temporary password: ${data.temporaryPassword}`,"success",$("resetMessage"));
 }catch(err){message(err.message||"Reset failed.","error",$("resetMessage"))}
};

</script>
</body>
</html>
